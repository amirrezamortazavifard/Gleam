name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gleam ${{ github.ref_name }}'
          releaseBody: |
            ## ✨ Gleam ${{ github.ref_name }} — Premium Obsidian Glass Desktop Companion

            ### 🚀 What's New in v1.0.4:
            - **Obsidian Glass Design System:** Complete redesign into a premium, minimalist desktop companion widget inspired by Apple macOS design principles.
            - **Refined Obsidian Navy Palette:** Built on deep obsidian navy (`#0B1220`) canvas, dark acrylic surfaces (`#111D2D`, `#19283B`), and Sapphire Cyan (`#47D1E2`) accents.
            - **Simplified Executive Header:** Clear visual hierarchy, unified 28px glass controls, live status dot, and persistent shortcut pill.
            - **Elegant Daily Overview:** Mathematical circular progress ring, dynamic motivational motto, and clean segmented progress counters.
            - **Floating Task Input:** Floating obsidian card with deep dark input well and tactile Sapphire Cyan quick-add button.
            - **Minimal Segmented Filters:** macOS-style unified segmented tabs (All, Active, Done, Urgent) replacing loud neon fills.
            - **Subtle Task Cards:** Subtle surfaces with 3px leading-edge priority accent stripes, custom squircle checkboxes, and hover-revealed action buttons.
            - **Integrated Search & Minimal Footer:** Clean integrated search pill and contextual task count footer.
            - **Persian RTL & English Parity:** Enhanced bilingual alignment with Vazirmatn typography and forced LTR shortcut rendering.

            ### 📦 Downloads:
            Download the Windows setup installer (`.exe`) or Windows Installer (`.msi`) below.
          releaseDraft: false
          prerelease: false
