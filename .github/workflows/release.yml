name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gleam ${{ github.ref_name }}'
          releaseBody: |
            ## ✨ Gleam ${{ github.ref_name }} — Modern Frosted Glass Task Drawer

            ### 🚀 What's New in v1.0.2:
            - **Resilient Data Persistence & Atomic Saves:** Zero data loss on reboot or sudden shutdown using atomic file writes (`.tmp` write and `.bak` safety redundancy).
            - **Self-Healing Deserialization & Backup Recovery:** Automatic fallback to backup storage and corrupted file quarantine to protect user data from unexpected serde errors.
            - **Dual-Layer Cache Architecture:** Added instant reactivity and synchronous protection using synchronized localStorage caching alongside native OS AppData storage.
            - **Bilingual Calendar Parity:** True Gregorian calendar rendering in English mode and Jalali calendar in Persian mode with accurate month/day localization.
            - **Category Filter Synchronization:** Canonical category mapping preventing task disappearance when switching between English and Persian or applying category filters.
            - **Task Notes Preview Snippet:** Translucent inline preview of task notes directly on task cards.
            - **Subtask Accordion State Retention:** Preserved open/collapsed state of subtasks across card re-renders.
            - **Dynamic RTL/LTR Form Parity:** Polished text alignment for clean bilingual form inputs and cards.

            ### 📦 Downloads:
            Download the Windows setup installer (`.exe`) or Windows Installer (`.msi`) below.
          releaseDraft: false
          prerelease: false
