name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gleam ${{ github.ref_name }}'
          releaseBody: |
            ## ✨ Gleam ${{ github.ref_name }} — Modern Frosted Glass Task Drawer

            ### 🚀 What's New in v1.0.3:
            - **Telegram-Style In-App Auto-Updater:** Download and install updates completely in-app with zero manual downloads or browser visits.
            - **Real-Time Streaming Progress Bar:** Frosted glass progress indicator with live percentage and MB counters in both the top banner and settings panel.
            - **Silent NSIS Installation & Auto-Restart:** Headless `/S` background installer execution with seamless restart into the updated version.
            - **Multi-Source Binary Detection:** Automatically picks up the newest official Windows NSIS setup package from GitHub Releases.
            - **Bilingual Update Status:** Complete Persian and English status messages and notifications.

            ### 📦 Downloads:
            Download the Windows setup installer (`.exe`) or Windows Installer (`.msi`) below.
          releaseDraft: false
          prerelease: false
