name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gleam ${{ github.ref_name }}'
          releaseBody: |
            ## ✨ Gleam ${{ github.ref_name }} — Modern Frosted Glass Task Drawer

            ### 🚀 What's New in v1.0.1:
            - **Windows Startup Integration:** Toggle auto-start silently on Windows boot via system registry without UAC friction.
            - **Hardware-Accelerated Slide & Fade:** Fluid native drawer entrance and exit animations docked to the right screen edge.
            - **Strict Bilingual Parity (100% English & 100% Persian):** Seamless bidirectional category translation, localized system tray menus, calendar controls, and prompts.
            - **Native Desktop App Hardening:** Disabled default browser context menus, F12 inspect tools, and browser refresh shortcuts for a pure desktop app feel.
            - **Glassmorphic Confirmation Dialog:** Replaced ugly web confirm popups with a luxury translucent danger modal.
            - **GitHub Releases Auto-Updater:** Real-time update checks and glass notification banner for incoming updates.
            - **Refreshed Brand Logo & Icons:** High-resolution glassy cyan monogram and 53 platform-specific icon assets.

            ### 📦 Downloads:
            Download the Windows setup installer (`.exe`) or Windows Installer (`.msi`) below.
          releaseDraft: false
          prerelease: false
